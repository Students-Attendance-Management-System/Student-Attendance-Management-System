<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SAMS{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        nav {
            background: #1e3a8a;
            color: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 480px;
            margin: 55px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .wide {
            max-width: 750px;
        }

        h1 {
            margin-top: 0;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button, .button {
            display: inline-block;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
            margin-top: 18px;
        }

        button:hover, .button:hover {
            background: #1e40af;
        }

        .errorlist {
            color: #b91c1c;
            padding-left: 20px;
        }

        .helptext {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-top: 5px;
        }

        .messages {
            background: #fef3c7;
            padding: 12px;
            border-radius: 6px;
        }

        .muted {
            color: #64748b;
            font-size: 14px;
        }

        .logout-form {
            display: inline;
        }

        .logout-form button {
            margin: 0;
            padding: 8px 12px;
            background: #dc2626;
        }
    </style>
</head>

<body>
    <nav>
        <strong>SAMS | Student Attendance Management System</strong>

        <div>
            {% if user.is_authenticated %}
                <span>Hi, {{ user.username }}</span>

                <form class="logout-form"
                      method="post"
                      action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container {% block container_class %}{% endblock %}">
        {% if messages %}
            {% for message in messages %}
                <p class="messages">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
